[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earlydata-weekly-publisher"
version = "0.2.0"
description = "LLM-rank biopharma WeChat signals, generate compliant EarlyData HTML, and upload WeChat drafts."
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
earlydata-weekly = "earlydata_weekly_publisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
